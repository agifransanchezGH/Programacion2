<h1>Clientes</h1>
<div class="table-container">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Situación Fiscal</th>
        <th>DNI</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clients; let i = index">
        <td>{{ cliente.ID_cliente }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.apellido }}</td>
        <td>{{ cliente.situacion_fiscal }}</td>
        <td>{{ cliente.dni }}</td>
      </tr>
    </tbody>
  </table>
</div>
